<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default .Site.Language.Name | default "en" }}" data-theme="dark">
  <head>
    {{- partial "head.html" . -}}
  </head>
  <body>
    <div class="ambient-shadow" aria-hidden="true">
      <video
        id="ambient-shadow-video"
        class="ambient-shadow-video"
        muted
        loop
        playsinline
        preload="none"
        data-webm-src="{{ .Site.Params.ambientShadowVideoWebm | default "videos/tree-shadow.webm" | relURL }}"
        data-mp4-src="{{ .Site.Params.ambientShadowVideoMp4 | default "videos/tree-shadow.mp4" | relURL }}"></video>
    </div>

    {{- partial "header.html" . -}}

    <main class="site-main">
      {{- block "main" . }}{{- end }}
    </main>

    {{- partial "footer.html" . -}}

    <!-- Screen-reader announcements -->
    <div id="sr-announce" aria-live="polite" aria-atomic="true" style="position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;"></div>

    <!-- Scroll to top -->
    <button id="scrollToTop" class="scroll-to-top" aria-label="Scroll to top" title="Back to top">↑</button>

    <!-- Image lightbox -->
    <div id="image-lightbox" class="image-lightbox" role="dialog" aria-modal="true">
      <div class="lightbox-overlay" id="lightbox-overlay"></div>
      <div class="lightbox-content">
        <div class="lightbox-controls">
          <button class="lightbox-close" id="lb-close">✕ close</button>
        </div>
        <div class="lightbox-image-container" id="lb-image-container">
          <img id="lb-image" src="" alt="">
        </div>
      </div>
    </div>

    <!-- Core scripts -->
    <script src="{{ "js/main.js" | relURL }}" defer></script>
    {{- if .Page.Store.Get "hasCodeBlocks" }}
    <script src="{{ "js/code-actions.js" | relURL }}" defer></script>
    {{- end }}
    <script src="{{ "js/cookie-consent.js" | relURL }}" defer></script>
    <script src="{{ "js/pwa.js" | relURL }}" defer></script>

    {{- if .Site.Params.kroki.enabled }}
    <script>
      window.krokiConfig = {
        endpoint: {{ .Site.Params.kroki.endpoint | default "https://kroki.io" | jsonify }},
        cache:     {{ .Site.Params.kroki.cache     | default true  | jsonify }},
        lazyLoad:  {{ .Site.Params.kroki.lazyLoad  | default true  | jsonify }},
        timeout:   {{ .Site.Params.kroki.timeout   | default 10000 | jsonify }},
        retryCount:{{ .Site.Params.kroki.retryCount| default 1     | jsonify }}
      };
    </script>
    <script src="{{ "js/kroki.js" | relURL }}" defer></script>
    {{- end }}

    {{- partial "mermaid.html" . -}}

    {{- block "scripts" . }}{{- end }}
  </body>
</html>
