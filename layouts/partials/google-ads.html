{{- $client := or (index .Site.Params "googleadsclient") (index .Site.Params "googleAdsClient") (index .Site.Params "adsense_client_id") -}}
{{- $slot   := or (index .Site.Params "googleadsslot") (index .Site.Params "googleAdsSlot") -}}
{{- if and $client $slot -}}
<div class="post-ad-unit ads-blocked">
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="{{ $client }}"
       data-ad-slot="{{ $slot }}"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
</div>
{{- end -}}
