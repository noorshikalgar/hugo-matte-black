{{- $client := or .Site.Params.googleadsclient .Site.Params.googleAdsClient .Site.Params.adsense_client_id -}}
{{- $slot   := or .Site.Params.googleadsslot .Site.Params.googleAdsSlot -}}
{{- if and $client $slot -}}
<div class="post-ad-unit ads-blocked">
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="{{ $client }}"
       data-ad-slot="{{ $slot }}"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
</div>
{{- end -}}
