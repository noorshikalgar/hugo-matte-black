    },
    forest: {
      darkMode: true, background: '#1b211a',
      primaryColor: '#22291f', primaryTextColor: '#ebd5ab',

      secondaryColor: '#1b211a', tertiaryColor: '#31392e',

      clusterBkg: '#22291f', clusterBorder: '#3a4535',
      titleColor: '#9ecc76', nodeBorder: '#8bae66',

    },
    gruvbox: {

      secondaryColor: '#1d2021', tertiaryColor: '#3c3836',

    },
    graymatter: {
      darkMode: false, background: '#faf9f6',

    },
    'paper-diary': {

      primaryColor: '#dbd7cf', primaryTextColor: '#3a3733',
      primaryBorderColor: '#b3ada4', lineColor: '#6b655e',
      secondaryColor: '#d4d0c9', tertiaryColor: '#c9c4bc',
      edgeLabelBackground: '#d4d0c9', textColor: '#4b4741',
      clusterBkg: '#dbd7cf', clusterBorder: '#b3ada4',
      titleColor: '#56514b', nodeBorder: '#aaa49a',
      mainBkg: '#dbd7cf', nodeTextColor: '#3a3733', labelBackground: '#d4d0c9'
    },
    rosepine: {
      darkMode: false, background: '#f0e4d4',
      primaryColor: '#e8d9c6', primaryTextColor: '#2c2a44',

      edgeLabelBackground: '#f0e4d4', textColor: '#3c3a5a',

      titleColor: '#ff9b51', nodeBorder: '#a4b2bc',

    naval: {
      darkMode: true, background: '#252840',
      primaryColor: '#30364f', primaryTextColor: '#f0f0db',

    },
    'github-light': {
      darkMode: false, background: '#ffffff',
      primaryColor: '#f6f8fa', primaryTextColor: '#24292f',
      primaryBorderColor: '#d0d7de', lineColor: '#0969da',
      secondaryColor: '#ffffff', tertiaryColor: '#eaeef2',
      edgeLabelBackground: '#ffffff', textColor: '#24292f',
      clusterBkg: '#f6f8fa', clusterBorder: '#d0d7de',
      titleColor: '#0969da', nodeBorder: '#d0d7de',
      mainBkg: '#f6f8fa', nodeTextColor: '#24292f', labelBackground: '#ffffff',
      actorBkg: '#f6f8fa', actorBorder: '#d0d7de', actorTextColor: '#24292f',
      noteBkgColor: '#fff8c5', noteTextColor: '#24292f', noteBorderColor: '#d4a72c',
      activationBkgColor: '#ddf4ff', activationBorderColor: '#0969da'
    },
    terminal: {
      darkMode: true, background: '#040505',
      primaryColor: '#090b0a', primaryTextColor: '#d8e5dc',
      primaryBorderColor: '#16f2a5', lineColor: '#43d7ff',
      secondaryColor: '#040505', tertiaryColor: '#101513',
      edgeLabelBackground: '#040505', textColor: '#96b2a1',
      clusterBkg: '#090b0a', clusterBorder: '#1a231f',
      titleColor: '#e7ef57', nodeBorder: '#16f2a5',
      mainBkg: '#090b0a', nodeTextColor: '#d8e5dc', labelBackground: '#040505'
    }
  };

  /* ── Save original diagram sources before any rendering ─────── */
  var mermaidSources = [];
  document.querySelectorAll('.mermaid').forEach(function(el, i) {
    mermaidSources[i] = el.textContent.trim();
    el.dataset.mermaidIdx = String(i);
  });

  function supportsHandDrawn(source) {
    var body = source.replace(/^\s*%%\{init:[\s\S]*?\}%%\s*/i, '').trim();
    return /^(graph|flowchart|stateDiagram|stateDiagram-v2|classDiagram|erDiagram|journey|mindmap|quadrantChart)\b/i.test(body);
  }

  function withSupportedHandDrawnInit(source) {
    if (!supportsHandDrawn(source)) return source;
    if (/^\s*%%\{init:/i.test(source)) return source;
    return '%%{init: {"look": "handDrawn"}}%%\n' + source;
  }

  /* ── Post-process a single rendered mermaid container ────────── */
  function postProcess(container) {
    var svg = container.querySelector('svg');
    if (!svg) return;

    svg.style.maxWidth = 'none';
    svg.style.width    = '100%';
    svg.style.height   = 'auto';
    svg.removeAttribute('width');
    svg.removeAttribute('height');

    var scale = 0.75;
    var STEP  = 0.25;
    var MIN   = 0.25;
    var MAX   = 4;

    var inner = document.createElement('div');
    inner.className = 'mermaid-scroll-inner';
    container.appendChild(inner);
    inner.appendChild(svg);

    function applyScale() {
      svg.style.width       = (scale * 100) + '%';
      svg.style.height      = 'auto';
      inner.style.overflowX = scale > 1 ? 'auto' : 'visible';
      inner.style.overflowY = scale > 1 ? 'auto' : 'visible';
      inner.style.cursor    = scale > 1 ? 'grab' : '';
    }

    applyScale();

    var bar = document.createElement('div');
    bar.className = 'mermaid-toolbar';
    bar.innerHTML =
      '<button title="Zoom in"  data-action="zoomIn">+</button>'  +
      '<button title="Zoom out" data-action="zoomOut">&minus;</button>' +
      '<button title="Reset"    data-action="reset">&#8635;</button>';
    container.insertBefore(bar, inner);

    bar.addEventListener('click', function(e) {
      var btn = e.target.closest('button');
      if (!btn) return;
      var action = btn.dataset.action;
      if (action === 'zoomIn')  { scale = Math.min(scale + STEP, MAX); applyScale(); }
      if (action === 'zoomOut') { scale = Math.max(scale - STEP, MIN); applyScale(); }
      if (action === 'reset')   { scale = 0.75; applyScale(); }
    });

    var panning = false, panStartX, panStartY, scrollStartX, scrollStartY;
    inner.addEventListener('mousedown', function(e) {
      if (scale <= 1) return;
      panning = true;
      panStartX = e.clientX; panStartY = e.clientY;
      scrollStartX = inner.scrollLeft; scrollStartY = inner.scrollTop;
      inner.style.cursor = 'grabbing';
      e.preventDefault();
    });
    document.addEventListener('mousemove', function(e) {
      if (!panning) return;
      inner.scrollLeft = scrollStartX - (e.clientX - panStartX);
      inner.scrollTop  = scrollStartY - (e.clientY - panStartY);
    });
    document.addEventListener('mouseup', function() {
      if (panning) { panning = false; inner.style.cursor = scale > 1 ? 'grab' : ''; }
    });

    var touchStartX, touchStartY, touchScrollX, touchScrollY;
    inner.addEventListener('touchstart', function(e) {
      if (scale <= 1 || e.touches.length !== 1) return;
      touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
      touchScrollX = inner.scrollLeft;    touchScrollY = inner.scrollTop;
    }, { passive: true });
    inner.addEventListener('touchmove', function(e) {
      if (scale <= 1 || e.touches.length !== 1) return;
      inner.scrollLeft = touchScrollX - (e.touches[0].clientX - touchStartX);
      inner.scrollTop  = touchScrollY - (e.touches[0].clientY - touchStartY);
      e.preventDefault();
    }, { passive: false });
  }

  /* ── Render (or re-render) all diagrams with a given accent ─── */
  function renderAll(accent) {
    var vars = MERMAID_THEMES[accent] || MERMAID_THEMES['amber'];

    /* Reset each container back to its original source text */
    document.querySelectorAll('.mermaid').forEach(function(el) {
      var toolbar = el.querySelector('.mermaid-toolbar');
      if (toolbar) toolbar.remove();
      var inner = el.querySelector('.mermaid-scroll-inner');
      if (inner) {
        /* Hoist any remaining children (svg) before removing wrapper */
        while (inner.firstChild) el.appendChild(inner.firstChild);
        inner.remove();
      }
      var svg = el.querySelector('svg');
      if (svg) svg.remove();
      el.textContent = withSupportedHandDrawnInit(mermaidSources[el.dataset.mermaidIdx] || '');
      el.removeAttribute('data-processed');
    });

    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      themeVariables: vars
    });
    mermaid.run({ querySelector: '.mermaid' }).then(function() {
      document.querySelectorAll('.mermaid').forEach(postProcess);
    });
  }

  /* ── Initial render ─────────────────────────────────────────── */
  renderAll(document.documentElement.getAttribute('data-accent') || 'amber');

  /* ── Re-render whenever the accent theme changes ────────────── */
  new MutationObserver(function(mutations) {
    for (var i = 0; i < mutations.length; i++) {
      if (mutations[i].attributeName === 'data-accent') {
        renderAll(document.documentElement.getAttribute('data-accent') || 'amber');
        break;
      }
    }
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-accent'] });

});
</script>
