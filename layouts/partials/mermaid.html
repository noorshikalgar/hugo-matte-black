{{- if .Page.Store.Get "hasMermaid" -}}
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var isGrayMatter = document.documentElement.getAttribute('data-accent') === 'graymatter';

  var darkVars = {
    darkMode:         true,
    background:       '#121212',
    primaryColor:     '#212121',
    primaryTextColor: '#EAEAEA',
    primaryBorderColor: '#333333',
    lineColor:        '#F59E0B',
    secondaryColor:   '#1a1a1a',
    tertiaryColor:    '#262626',
    edgeLabelBackground: '#121212',
    textColor:        '#bebebe',
    clusterBkg:       '#1a1a1a',
    clusterBorder:    '#333333',
    titleColor:       '#F59E0B',
    nodeBorder:       '#333333',
    mainBkg:          '#212121',
    nodeTextColor:    '#EAEAEA',
    labelBackground:  '#212121'
  };

  var lightVars = {
    darkMode:         false,
    background:       '#faf9f6',
    primaryColor:     '#e4e0d8',
    primaryTextColor: '#2c2c2c',
    primaryBorderColor: '#c5c1b8',
    lineColor:        '#5b6ec2',
    secondaryColor:   '#f0ede6',
    tertiaryColor:    '#d6d2c9',
    edgeLabelBackground: '#faf9f6',
    textColor:        '#2c2c2c',
    clusterBkg:       '#f0ede6',
    clusterBorder:    '#c5c1b8',
    titleColor:       '#5b6ec2',
    nodeBorder:       '#c5c1b8',
    mainBkg:          '#e4e0d8',
    nodeTextColor:    '#2c2c2c',
    labelBackground:  '#faf9f6'
  };

  mermaid.initialize({
    startOnLoad: false,
    theme: 'base',
    themeVariables: isGrayMatter ? lightVars : darkVars
  });

  mermaid.run({ querySelector: '.mermaid' }).then(function() {
    document.querySelectorAll('.mermaid').forEach(function(container) {
      var svg = container.querySelector('svg');
      if (!svg) return;

      // Strip Mermaid 10's inline max-width / explicit dimensions so CSS controls size
      svg.style.maxWidth = 'none';
      svg.style.width    = '100%';
      svg.style.height   = 'auto';
      svg.removeAttribute('width');
      svg.removeAttribute('height');

      // ── Simple scale-based zoom (no fixed container height needed) ──
      var scale  = 0.75;  // initial: 75% width — fits the diagram without excess scrolling
      var STEP   = 0.25;
      var MIN    = 0.25;
      var MAX    = 4;

      // Wrap SVG in an inner scroll container so the toolbar (on the outer
      // container) stays fixed while only the inner div scrolls.
      var inner = document.createElement('div');
      inner.className = 'mermaid-scroll-inner';
      container.appendChild(inner);
      inner.appendChild(svg);

      function applyScale() {
        svg.style.width  = (scale * 100) + '%';
        svg.style.height = 'auto';
        inner.style.overflowX = scale > 1 ? 'auto' : 'visible';
        inner.style.overflowY = scale > 1 ? 'auto' : 'visible';
        inner.style.cursor    = scale > 1 ? 'grab' : '';
      }

      applyScale(); // apply initial scale immediately

      // Inject toolbar onto outer container (not inner scroll div)
      var bar = document.createElement('div');
      bar.className = 'mermaid-toolbar';
      bar.innerHTML =
        '<button title="Zoom in"  data-action="zoomIn">+</button>'  +
        '<button title="Zoom out" data-action="zoomOut">&minus;</button>' +
        '<button title="Reset"    data-action="reset">&#8635;</button>';
      container.insertBefore(bar, inner);

      bar.addEventListener('click', function(e) {
        var btn = e.target.closest('button');
        if (!btn) return;
        var action = btn.dataset.action;
        if (action === 'zoomIn')  { scale = Math.min(scale + STEP, MAX); applyScale(); }
        if (action === 'zoomOut') { scale = Math.max(scale - STEP, MIN); applyScale(); }
        if (action === 'reset')   { scale = 0.75; applyScale(); }
      });

      // ── Drag-to-pan on the inner scroll container ──
      var panning = false, panStartX, panStartY, scrollStartX, scrollStartY;

      inner.addEventListener('mousedown', function(e) {
        if (scale <= 1) return;
        panning = true;
        panStartX    = e.clientX;
        panStartY    = e.clientY;
        scrollStartX = inner.scrollLeft;
        scrollStartY = inner.scrollTop;
        inner.style.cursor = 'grabbing';
        e.preventDefault();
      });

      document.addEventListener('mousemove', function(e) {
        if (!panning) return;
        inner.scrollLeft = scrollStartX - (e.clientX - panStartX);
        inner.scrollTop  = scrollStartY - (e.clientY - panStartY);
      });

      document.addEventListener('mouseup', function() {
        if (panning) {
          panning = false;
          inner.style.cursor = scale > 1 ? 'grab' : '';
        }
      });

      // Touch pan
      var touchStartX, touchStartY, touchScrollX, touchScrollY;
      inner.addEventListener('touchstart', function(e) {
        if (scale <= 1 || e.touches.length !== 1) return;
        touchStartX  = e.touches[0].clientX;
        touchStartY  = e.touches[0].clientY;
        touchScrollX = inner.scrollLeft;
        touchScrollY = inner.scrollTop;
      }, { passive: true });

      inner.addEventListener('touchmove', function(e) {
        if (scale <= 1 || e.touches.length !== 1) return;
        inner.scrollLeft = touchScrollX - (e.touches[0].clientX - touchStartX);
        inner.scrollTop  = touchScrollY - (e.touches[0].clientY - touchStartY);
        e.preventDefault();
      }, { passive: false });
    });
  });
});
</script>
{{- end -}}
