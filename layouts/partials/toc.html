{{- if (eq .Params.toc true) -}}
  {{- if gt (len .TableOfContents) 100 -}}
  <div class="toc-section toc-inline">
    <div class="toc-header" id="toc-header" role="button" tabindex="0" aria-expanded="false" aria-controls="toc-content">
      <h3>Table of Contents</h3>
      <span class="toc-toggle" id="toc-toggle" aria-hidden="true">▶</span>
    </div>
    <div class="toc-content collapsed" id="toc-content">
      {{ .TableOfContents }}
    </div>
  </div>
  {{- end -}}
{{- end -}}
