{{ define "main" }}
<div>
  <!-- Header -->
  <div class="section-header">
    <h1>Tags</h1>
    <span class="meta-text">{{ len .Site.Taxonomies.tags }} tags</span>
  </div>

  <!-- Controls -->
  <div class="tags-controls">
    <input
      type="search"
      id="tag-search"
      placeholder="filter tags…"
      class="tag-filter-input"
      aria-label="Filter tags"
    >
    <select id="tag-sort" class="sort-select">
      <option value="count-desc" selected>count ↓</option>
      <option value="count-asc">count ↑</option>
      <option value="name-asc">a → z</option>
      <option value="name-desc">z → a</option>
    </select>
  </div>

  <!-- Tags table -->
  <div class="tags-table-container">
    <table class="tags-table" id="tags-table" aria-label="Tags list">
      <thead>
        <tr>
          <th data-sort="name" class="tag-name-col">tag</th>
          <th data-sort="count" class="tag-count-col" style="text-align:right;width:100px;">articles</th>
        </tr>
      </thead>
      <tbody id="tags-tbody">
        {{- range $name, $taxonomy := .Site.Taxonomies.tags }}
          <tr class="tag-row" data-name="{{ $name }}" data-count="{{ len $taxonomy }}">
            <td class="tag-name">
              <a href="{{ "/tags/" | relURL }}{{ $name | urlize }}/">{{ $name }}</a>
            </td>
            <td class="tag-count">{{ len $taxonomy }}</td>
          </tr>
        {{- end }}
      </tbody>
    </table>
  </div>
  <nav class="pagination" id="tags-pagination" style="display:none;margin-top:1.25rem;"></nav>
</div>
{{ end }}

{{ define "scripts" }}
<script>
(function() {
  const searchInput = document.getElementById('tag-search');
  const sortSelect  = document.getElementById('tag-sort');
  const tbody       = document.getElementById('tags-tbody');
  const pagination  = document.getElementById('tags-pagination');
  const PAGE_SIZE   = 25;

  // Cache ALL rows once — never query live DOM after this
  const allRows = Array.from(tbody.querySelectorAll('.tag-row'));

  function filterRows() {
    const q = searchInput.value.toLowerCase().trim();
    return q ? allRows.filter(r => r.dataset.name.includes(q)) : allRows.slice();
  }

  function sortRows(rows) {
    const val = sortSelect.value;
    rows.sort((a, b) => {
      const aName  = a.dataset.name;
      const bName  = b.dataset.name;
      const aCount = +a.dataset.count;
      const bCount = +b.dataset.count;
      if (val === 'name-asc')   return aName.localeCompare(bName);
      if (val === 'name-desc')  return bName.localeCompare(aName);
      if (val === 'count-asc')  return aCount - bCount;
      return bCount - aCount; // count-desc default
    });
    return rows;
  }

  function renderPage(rows, page) {
    tbody.innerHTML = '';
    const start = (page - 1) * PAGE_SIZE;
    const end = start + PAGE_SIZE;
    rows.slice(start, end).forEach(r => tbody.appendChild(r));
  }

  function renderPagination(total, page) {
    const totalPages = Math.ceil(total / PAGE_SIZE);
    if (totalPages <= 1) { pagination.innerHTML = ''; pagination.style.display = 'none'; return; }
    pagination.style.display = '';
    let html = '';
    if (page > 1) html += `<a href="#" class="pagination-btn" data-page="${page-1}">← Prev</a>`;
    html += `<span class="pagination-info">Page ${page} of ${totalPages}</span>`;
    if (page < totalPages) html += `<a href="#" class="pagination-btn" data-page="${page+1}">Next →</a>`;
    pagination.innerHTML = html;
    Array.from(pagination.querySelectorAll('.pagination-btn')).forEach(btn => {
      btn.onclick = e => { e.preventDefault(); goToPage(+btn.dataset.page); };
    });
  }

  let currentPage = 1;
  let filteredSortedRows = [];

  function update() {
    filteredSortedRows = sortRows(filterRows());
    currentPage = 1;
    renderPage(filteredSortedRows, currentPage);
    renderPagination(filteredSortedRows.length, currentPage);
  }

  function goToPage(page) {
    currentPage = page;
    renderPage(filteredSortedRows, currentPage);
    renderPagination(filteredSortedRows.length, currentPage);
  }

  searchInput.addEventListener('input', update);
  sortSelect.addEventListener('change', update);
  update();
})();
</script>
{{ end }}
